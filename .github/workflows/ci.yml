name: VendeAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend CI (NestJS + Prisma)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package.json'

      - name: Install Backend Dependencies
        run: |
          cd apps/backend
          npm ci || npm install

      - name: Generate Prisma Client
        run: |
          cd apps/backend
          npx prisma generate

      - name: Build Backend
        run: |
          cd apps/backend
          npm run build

      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          npm run test -- --passWithNoTests

  mobile-test:
    name: Mobile CI (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: |
          cd apps/mobile
          flutter test
