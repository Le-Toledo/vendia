name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vendeai_test
          POSTGRES_PASSWORD: vendeai_test
          POSTGRES_DB: vendeai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vendeai_test -d vendeai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vendeai_test:vendeai_test@localhost:5432/vendeai_test?schema=public
      JWT_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-different-and-at-least-32-characters
      AI_PROVIDER: mock
      GOOGLE_AUTH_ENABLED: 'false'
      CORS_ORIGINS: http://localhost:8080
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
