name: vendeai_mobile
description: "VendAI - Assistente Inteligente de Gestão para Autônomos, MEIs e Pequenas Empresas"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.10.3 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0

  # Data & Modeling
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Network & Storage
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI, Fonts & Visuals
  fl_chart: ^0.66.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  google_sign_in: ^7.2.0
  sign_in_with_apple: 7.0.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
