services:
  postgres:
    image: postgres:15-alpine
    container_name: vendeai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vendeai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vendeai_pass_2026}
      POSTGRES_DB: ${DB_NAME:-vendeai_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vendeai_user} -d ${DB_NAME:-vendeai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: vendeai_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: "postgresql://${DB_USER:-vendeai_user}:${DB_PASSWORD:-vendeai_pass_2026}@postgres:5432/${DB_NAME:-vendeai_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be configured}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APPLE_AUTH_ENABLED: ${APPLE_AUTH_ENABLED:-false}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_TOKEN_ENCRYPTION_KEY: ${APPLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PRIVACY_CONTROLLER_NAME: ${PRIVACY_CONTROLLER_NAME:-VendeAI}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-vendeai.suport@gmail.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
